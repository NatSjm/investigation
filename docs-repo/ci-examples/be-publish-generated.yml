# Lives in the BE repo (.github/workflows/publish-docs-artifacts.yml). Publishes generated artifacts to the docs repo.
# NOTE: this variant uses build plugins (springdoc, springwolf, Dokka). If third-party plugins are not allowed,
# use the library-free generators in ../../code-repo-kit/ (ci/docs-maps.yml) instead.
name: publish-docs-artifacts
on:
  push:
    branches: [main]
    paths: ["**/src/main/**", "**/pom.xml", "**/db/changelog/**"]

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg, POSTGRES_DB: adv }
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }

      # 1. OpenAPI — springdoc-openapi-maven-plugin (starts app in test profile, dumps /v3/api-docs.yaml)
      - run: mvn -q -pl core -am verify -DskipTests -Pdocs-openapi
      # 2. AsyncAPI — springwolf (same run, /springwolf/docs.yaml)
      # 3. DB schema — Liquibase on empty DB, then SchemaSpy-like dump to Markdown + Mermaid erDiagram
      - run: mvn -q -pl core liquibase:update -Ddb.url=jdbc:postgresql://localhost:5432/harbor
      - run: ./scripts/docs/gen-db-schema.sh > target/docs/db/schema.md
      # 4. API surface — Dokka markdown, then strip bodies/private; alternatively detekt custom rule dumping signatures
      - run: mvn -q dokka:dokka -Ddokka.format=gfm && ./scripts/docs/strip-api-surface.sh target/dokka target/docs/api-surface/be
      # 5. Codebase map — modules from pom.xml -> layers -> classes, manager KDoc @docs tags, controllers/listeners/jobs by annotation scan
      - run: ./scripts/docs/gen-codebase-map.sh > target/docs/codebase-map.be.md

      - name: Open PR in docs repo
        env: { GIT_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }} }
        run: |
          git clone --depth 1 https://x:${GIT_TOKEN}@git.example.com/harbor/harbor-docs docs
          rsync -a --delete target/docs/openapi/ docs/generated/openapi/
          rsync -a --delete target/docs/asyncapi/ docs/generated/asyncapi/
          rsync -a --delete target/docs/db/ docs/generated/db/
          rsync -a --delete target/docs/api-surface/be/ docs/generated/api-surface/be/
          cp target/docs/codebase-map.be.md docs/generated/codebase-map.be.md
          cd docs && git checkout -b gen/be-${GITHUB_SHA::7}
          git add generated && git -c user.name=ci -c user.email=ci@harbor.example.com commit -m "chore(generated): BE artifacts from ${GITHUB_SHA::7}

          Changed source paths:
          $(git -C .. diff --name-only HEAD~1 HEAD | sed 's/^/- /')" || exit 0
          git push -u origin HEAD
          gh pr create --fill --label generated --body-file <(echo "Run agent doc-sync on this PR.")
