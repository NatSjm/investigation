feature: HEDGE-001
project: ADV
epic:
  jira_key: null
  summary: "Propose interest-rate hedge for a loan"
  description: |
    Advisor creates an IRS proposal for a client's floating loan with monthly cashflow preview.
    Spec: features/hedges/HEDGE-001.md
  labels: [hedges, docs-generated]
stories:
  - id: S1
    jira_key: null
    summary: "Create hedge proposal for an active loan"
    component: vertical
    description: |
      Advisor selects loan, enters fixed rate/tenor/notional, saves proposal. Limits validated.
    acceptance_criteria:
      - rule: BR-HEDGE-001-1
        gherkin: |
          Given client "ACME-SYN" has active loan "L-1" and closed loan "L-2"
          When the advisor creates a proposal for loan "L-2"
          Then the request is rejected with error "LOAN_NOT_ACTIVE"
      - rule: BR-HEDGE-001-2
        gherkin: |
          Given loan "L-1" has outstanding principal 1,000,000 EUR on 2027-01-01
          When the advisor sets notional 1,000,000.01 EUR starting 2027-01-01
          Then the request is rejected with error "NOTIONAL_EXCEEDS_PRINCIPAL"
    estimate: 5
    labels: [hedges]
    depends_on: []
    subtasks:
      - summary: "[DB] Liquibase changeset hedge_proposal, hedge_leg"
        estimate_hours: 3
      - summary: "[BE] POST /hedges/proposals with BR-1/BR-2/BR-3 validation"
        estimate_hours: 8
      - summary: "[FE] ProposeHedgePage form + validation messages"
        estimate_hours: 8
      - summary: "[TEST] API scenarios HEDGE-001 S1"
        estimate_hours: 4
  - id: S2
    jira_key: null
    summary: "Preview monthly cashflows before saving"
    component: vertical
    description: |
      Preview endpoint computes fixed vs floating cashflows per month via hedge_monthly_cashflow.
    acceptance_criteria:
      - rule: BR-HEDGE-001-4
        gherkin: |
          Given notional 1,000,000, fixed 3.00%, floating 2.50%, 30-day month
          When the preview is requested
          Then the net cashflow for that month is 416.67
    estimate: 5
    labels: [hedges, calc]
    depends_on: [S1]
    subtasks:
      - summary: "[BE] POST /hedges/proposals/preview"
        estimate_hours: 6
      - summary: "[FE] Cashflow table + graph"
        estimate_hours: 8
      - summary: "[TEST] calc scenario outline from worked examples"
        estimate_hours: 3
  - id: S3
    jira_key: null
    summary: "Publish proposal.created event"
    component: integration
    description: |
      Emit advisory.hedge.proposal.created after successful save (transactional outbox).
    acceptance_criteria:
      - rule: BR-HEDGE-001-5
        gherkin: |
          Given a proposal is saved successfully
          Then exactly one "advisory.hedge.proposal.created" message with the proposal id is published
    estimate: 3
    labels: [kafka]
    depends_on: [S1]
    subtasks:
      - summary: "[INT] Outbox entry + publisher"
        estimate_hours: 6
      - summary: "[TEST] consumer contract test"
        estimate_hours: 3
questions:
  - "Is BR-HEDGE-001-3 a hard block or an override-able warning?"
