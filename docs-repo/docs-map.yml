# Traceability: code path globs (relative to the code repo roots, prefixed `be/` = harbor-backend,
# `fe/` = harbor-frontend) -> feature specs / calculation docs.
# Used by scripts/map-paths.py (PR changed files -> specs) and scripts/check-freshness.py (CI gate).
# Rule: a PR touching a mapped path must either bump last_verified in the spec or carry label `docs-not-affected`.
# The backend is layered (harbor-core/src/main/kotlin/com/acme/harbor/<layer>/), so BE globs select a context by CLASS-NAME PREFIX
# (prefixes from contexts.yml; `**/` = any layer folder, `*` = rest of the file name). A file matching prefixes of
# two contexts (e.g. `Movement*` vs `MovementInput*`) maps to both specs - harmless, the union is reviewed.
# The frontend is organised by page (fe/src/pages/<Page>/**); pieces shared by several pages sit under
# fe/src/pages/shared/{components,hook}/ and are mapped per file, the app shell (routing, layouts, channel) per folder.

mappings:
  # --- bounded contexts with a spec ---
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Client*.kt", "fe/src/pages/ClientSearchPage/**", "fe/src/pages/ClientOverviewPage/**", "fe/src/types/clients.ts"]
    specs: ["features/clients/CLI-001.md"]
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Session*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Meeting*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/RoleOverride*.kt", "fe/src/pages/ClientMeetingsPage/**", "fe/src/pages/PreparationSessionsPage/**", "fe/src/pages/SessionSummaryPage/**", "fe/src/pages/shared/components/MeetingsListPage/**", "fe/src/pages/shared/hook/useSessions.ts", "fe/src/types/meetings.ts", "fe/src/services/api/sessionStore.ts", "fe/src/components/layout/SessionLayout.tsx", "fe/src/routing/SessionRoutes.tsx"]
    specs: ["features/meetings/SES-001.md"]
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Product1*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Projection*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Peer*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/MovementInput*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/SessionMovementInput*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/SessionPeerSimulation*.kt", "fe/src/pages/Product1OverviewPage/**", "fe/src/pages/shared/components/ProjectionTables/**", "fe/src/pages/shared/components/CoverRatioChart/**", "fe/src/pages/shared/components/MovementInputModal/**", "fe/src/pages/shared/components/PeerSimulationModal/**", "fe/src/types/product1.ts"]
    specs: ["features/product1/P1-001.md", "features/product1/P1-002.md", "features/product1/P1-003.md"]
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Stress*.kt", "fe/src/pages/StressTestPage/**", "fe/src/types/stress.ts"]
    specs: ["features/stress/STR-001.md"]
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Market*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Scenario*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/BaselinePrice*.kt", "fe/src/pages/ScenariosPage/**", "fe/src/pages/shared/hook/useBaselinePrices.ts", "fe/src/types/market.ts"]
    specs: ["features/market/MKT-001.md"]
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Report*.kt", "be/harbor-core/src/main/resources/pdf/**", "fe/src/pages/shared/components/ReportPreview/**", "fe/src/pages/shared/components/DownloadPdfButton/**", "fe/src/pages/shared/hook/useReport.ts", "fe/src/pages/shared/hook/useDownloadReportPdf.ts", "fe/src/types/reports.ts"]
    specs: ["features/reports/RPT-001.md"]

  # --- bounded contexts without a spec yet (appear as `code only` in generated/graph/REPO_MAP.md) ---
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Product2*.kt", "fe/src/pages/Product2OverviewPage/**", "fe/src/types/product2.ts"]
    specs: ["features/product2/P2-001.md", "features/product2/P2-002.md", "features/product2/P2-003.md"]
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Cover*.kt", "fe/src/pages/shared/components/CoverQuotePanel/**", "fe/src/pages/shared/hook/useCover*.ts", "fe/src/types/cover.ts"]
    specs: []  # TODO: COV-001
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Import*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Movement*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/GoodsMovement*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Xls*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Workbook*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/DailyMovement*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/MonthlySnapshot*.kt"]
    specs: []  # TODO: IMP-001
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/**/Admin*.kt", "be/harbor-core/src/main/kotlin/com/acme/harbor/**/Parameter*.kt", "fe/src/pages/ParametersPage/**", "fe/src/pages/ImportsPage/**", "fe/src/types/admin.ts", "fe/src/routing/AdminRoutesGuard.tsx"]
    specs: [ADM-001]
  - paths: ["fe/src/pages/PresentationPage/**", "fe/src/types/presentation.ts", "fe/src/components/broadcast/**", "fe/src/components/hook/usePresentation*.ts", "fe/src/components/layout/PresentationLayout.tsx"]
    specs: ["features/presentation/PRS-001.md", "flows/client-presentation.md"]

  # --- calculations, messaging, external services, contracts ---
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/utils/**"]
    specs: ["domain/calculations/**"]
  - paths: ["be/kafka-client/**", "be/harbor-core/src/main/kotlin/com/acme/harbor/event/**", "be/harbor-core/src/main/resources/openapi/harbor-events.yaml"]
    specs: ["architecture/integrations.md"]
  - paths: ["be/harbor-core/src/main/kotlin/com/acme/harbor/client/**", "be/harbor-core/src/main/resources/api/**"]
    specs: ["architecture/integrations.md"]
  - paths: ["be/harbor-core/src/main/resources/openapi/**"]
    specs: ["architecture/adr/0002-openapi-first-contracts.md", "features/clients/CLI-001.md", "features/meetings/SES-001.md", "features/product1/P1-001.md", "features/product1/P1-002.md", "features/product1/P1-003.md", "features/product2/P2-001.md", "features/product2/P2-002.md", "features/product2/P2-003.md", "features/stress/STR-001.md", "features/market/MKT-001.md", "features/reports/RPT-001.md"]

ignore:
  - "**/*Test.kt"
  - "**/src/test/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/README.md"
  - "fe/src/services/openapi/**"
