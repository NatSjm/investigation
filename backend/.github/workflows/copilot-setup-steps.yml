# Pre-installs the toolchain for the Copilot coding agent's environment. The job name MUST be `copilot-setup-steps`.
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]
  pull_request:
    paths: [".github/workflows/copilot-setup-steps.yml"]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate *Api interfaces from harbor-core/src/main/resources/openapi/openapi_harbor.yaml and resolve dependencies
        run: mvn -q -pl harbor-core -am -DskipTests generate-sources
