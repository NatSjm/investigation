# Local environment for harbor-backend (see README.md in this folder).
#   docker compose -f init_docker_compose/docker-compose.yml up -d
# PostgreSQL 16, Kafka (KRaft, single node, official apache/kafka image) with the Harbor topics, and one WireMock
# that stubs the five external services (client-registry, market-data, cover-provider, document-service, file-exchange).
# All data is synthetic.
name: harbor-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - harbor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Creates the Harbor topics (TOPIC constants of the listener / publisher classes in harbor-core, event/) plus their dead-letter topics.
  kafka-init:
    image: apache/kafka:3.7.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in harbor.imports.movements-loaded harbor.market.prices-updated harbor.meetings.session-closed \
                     harbor.reports.render-requested harbor.reports.rendered; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic.DLT" --partitions 1 --replication-factor 1
        done
    restart: "no"

  # One WireMock for all five external services; their paths do not overlap (see wiremock/mappings/*.json).
  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--port", "8089", "--global-response-templating", "--verbose"]
    ports:
      - "8089:8089"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

volumes:
  harbor-pgdata:
