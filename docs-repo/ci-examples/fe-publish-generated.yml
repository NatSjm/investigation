# Lives in the FE repo. Publishes FE generated artifacts to the docs repo.
name: publish-docs-artifacts
on:
  push:
    branches: [main]
    paths: ["src/**"]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # 1. API surface: public types/props/hooks of each feature barrel (no implementation)
      - run: npx tsc -p tsconfig.docs.json --declaration --emitDeclarationOnly --outDir out/api-surface
      # 2. Route map: script imports the router config and prints table "route | page component | feature folder"
      - run: node scripts/docs/gen-routes.mjs > out/routes.md
      # 3. Codebase map (FE half): feature folders, screens, hooks, api clients (from barrel exports + JSDoc @responsibility)
      - run: node scripts/docs/gen-codebase-map.mjs > out/codebase-map.fe.md
      # 4. Optional: Storybook static build → component inventory JSON (stories.json) for UI test design
      # - run: npm run build-storybook -- --quiet && cp storybook-static/index.json out/components.json

      - name: Open PR in docs repo
        env: { GIT_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }} }
        run: |
          git clone --depth 1 https://x:${GIT_TOKEN}@git.example.com/harbor/harbor-docs docs
          rsync -a --delete out/api-surface/ docs/generated/api-surface/fe/
          cp out/routes.md docs/generated/fe/routes.md
          cp out/codebase-map.fe.md docs/generated/codebase-map.fe.md
          cd docs && git checkout -b gen/fe-${GITHUB_SHA::7}
          git add generated && git -c user.name=ci -c user.email=ci@harbor.example.com commit -m "chore(generated): FE artifacts from ${GITHUB_SHA::7}" || exit 0
          git push -u origin HEAD && gh pr create --fill --label generated
