# Docs repo quality gates (GitHub Actions flavour; port 1:1 to GitLab CI / Azure Pipelines)
name: docs-quality
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with: { globs: "**/*.md" }
      - name: Frontmatter validation (Feature Spec / Attested Computation keys)
        shell: pwsh
        run: ./scripts/validate-frontmatter.ps1
      - name: Work items schema
        shell: pwsh
        run: ./scripts/validate-work-items.ps1
      - name: OKF bundle validation (PowerShell, §11 + trust/provenance warnings)
        shell: pwsh
        run: ./scripts/okf-validate.ps1 -Strict
      - name: OKF bundle validation (reference checker from okf-skills)
        # the reference checker has no exclude list -> stage only the knowledge folders as a bundle
        run: |
          rm -rf /tmp/okf-bundle && mkdir -p /tmp/okf-bundle
          cp -r index.md log.md README.md architecture domain features generated /tmp/okf-bundle/
          pip -q install pyyaml && python3 .github/skills/okf-validate/scripts/okf_validate.py /tmp/okf-bundle --strict
      - name: OKF indexes are up to date
        shell: pwsh
        run: ./scripts/build-index.ps1 -Check
      - name: Architectural graph is up to date (generated/graph)
        shell: pwsh
        run: if (Test-Path generated/be/codebase-map.md) { ./scripts/gen-graph.ps1 -Check }
      - name: Coverage matrix is up to date (generated/analytics)
        shell: pwsh
        run: |
          ./scripts/coverage-matrix.ps1 -Out /tmp/coverage-matrix.md
          $a = (Get-Content generated/analytics/coverage-matrix.md -Raw) -replace '(?m)^.*(generated:|stale_after:|Generated by).*$', ''
          $b = (Get-Content /tmp/coverage-matrix.md -Raw) -replace '(?m)^.*(generated:|stale_after:|Generated by).*$', ''
          if ($a -ne $b) { Write-Error 'coverage matrix stale - run scripts/coverage-matrix.ps1' }
      - name: Impacted specs for this PR (analytics comment input)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $files = git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'generated/**'
          if ($files -and (Test-Path generated/graph/graph.json)) { ./scripts/graph-query.ps1 -Files $files -Depth 2 }
      - name: OKF knowledge graph (artifact)
        if: always()
        run: python3 .github/skills/okf-visualize/scripts/okf_visualize.py /tmp/okf-bundle -o okf-graph.html -t "Harbor docs" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: okf-graph, path: okf-graph.html, if-no-files-found: ignore }
      - name: Link check
        uses: lycheeverse/lychee-action@v1
        with: { args: "--offline --no-progress '**/*.md'" }
      - name: Mermaid syntax check
        run: |
          npm i -g @mermaid-js/mermaid-cli
          for f in $(grep -rl '```mermaid' --include=*.md .); do
            awk '/```mermaid/{f=1;next}/```/{f=0}f' "$f" > /tmp/d.mmd && mmdc -i /tmp/d.mmd -o /tmp/d.svg || (echo "Mermaid error in $f" && exit 1)
          done
      - name: OpenAPI / AsyncAPI lint (published contracts)
        run: |
          npx @stoplight/spectral-cli lint generated/openapi/backend.yaml generated/openapi/external/*.yaml || true
          npx @asyncapi/cli validate generated/asyncapi/backend.yaml || true
          # proposals designed in this repo before code (contracts/conventions.md) are linted with the same rules
          ls contracts/proposed/*.openapi.yaml 2>/dev/null | grep -v _template && npx @stoplight/spectral-cli lint contracts/proposed/[!_]*.openapi.yaml || true
          ls contracts/proposed/*.asyncapi.yaml 2>/dev/null && npx @asyncapi/cli validate contracts/proposed/*.asyncapi.yaml || true

  publish-confluence:
    if: github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Publish changed docs
        shell: pwsh
        env:
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
        run: |
          $files = git diff --name-only HEAD~1 HEAD -- 'features/**/*.md' 'architecture/**/*.md' 'domain/**/*.md'
          if ($files) { ./scripts/confluence-publish.ps1 -Files $files }
