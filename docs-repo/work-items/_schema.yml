# Schema for work-items/*.yml (documented examples; validated by scripts/validate-work-items.py).
# Two shapes share the epic / stories / subtasks structure:
#   1. feature epic   - work-items/<FEATURE-ID>.yml, one spec (the usual case: /jira-from-spec)
#   2. request epic   - work-items/<slug>.yml + work-items/<slug>.md (the analysis), several specs: a request from an
#                       analyst that spans contexts, mixes existing and new behaviour, or follows a flow
#                       (template for the analysis: work-items/_analysis-template.md)

# ---------- 1. feature epic ----------
feature: CTX-000                # required, must exist in features/ (e.g. P1-001) and equal the file name
project: HRB                    # Jira project key
epic:
  jira_key: null                # filled by jira-push
  summary: "<= 80 chars"
  description: |
    Multi-line. Link to spec, e.g. features/product1/P1-001.md
  labels: [product1, docs-generated]
stories:
  - id: S1                      # local id for depends_on
    jira_key: null
    summary: "Imperative, <= 80 chars"
    component: vertical         # vertical | fe | be | db | integration
    description: |
      ...
    acceptance_criteria:
      - rule: BR-CTX-000-1      # exactly one business rule of the feature spec
        gherkin: |
          Given a session for client "ACME-SYN" and product group product1
          When the representative requests the overview
          Then the response contains four tables
    estimate: 3                 # 1,2,3,5,8
    labels: []
    depends_on: []              # [S0]
    subtasks:
      - summary: "[BE] ..."
        estimate_hours: 6       # <= 8
      - summary: "[FE] ..."
        estimate_hours: 4
      - summary: "[TEST] ..."
        estimate_hours: 3
questions:
  - "Open question the analyst could not resolve from the spec"

# ---------- 2. request epic (several specs) ----------
# request: quarterly-view-across-products          # lowercase kebab-case, equals the file name (never a spec ID)
# title: "Quarterly view on Product 1, Product 2 and the stress test"
# analysis: work-items/quarterly-view-across-products.md   # required: the analysis document written first
# specs: [P1-001, P2-001, STR-001]   # every spec a story cites; each must exist under features/ (a new spec is
#                                    # created as a draft by spec-writer before its rules are cited)
# flows: [/flows/session-inputs-recalculation.md]   # optional: the flows the request follows or changes
# contexts: [product1, product2, stress]            # optional, informative (the catalogue names them)
# project: HRB
# epic:
#   jira_key: null
#   summary: "<= 80 chars"
#   description: |
#     The request in one paragraph, link to the analysis document and to every spec.
#   labels: [product1, product2, stress, docs-generated]
# stories:
#   - id: S1                       # the same story shape as above; a story may cite rules of several specs
#     ...
#     acceptance_criteria:
#       - rule: BR-P1-001-7        # must belong to a spec of specs[]
#       - rule: BR-STR-001-5
#     depends_on: [S0]             # across contexts: the story that creates the contract / table / topic first
# questions:
#   - "..."
