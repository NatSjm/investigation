# Lives in each code repo as .github/workflows/docs-maps.yml (apply-kit.py copies it there).
# PR-time freshness check ONLY. Publication into the docs repository is done by the docs repo's single collector
# (harbor-docs/.github/workflows/collect-evidence.yml -> scripts/collect-evidence.py): one owner of publication, no
# docs-repo credentials in the code repos. Optional precise graph exports (be/templates/GraphExportTest.kt,
# fe scripts/docs/gen-graph-fe.ts) can be published as build artifacts for the collector to download.
# Lib-free: the generators are standard-library Python 3.11+; python3 is preinstalled on GitHub-hosted runners
# (self-hosted runners need a Python 3.11+ on PATH).
# REPO_KIND is `be` for harbor-backend and `fe` for harbor-frontend; set it in the repo variables.
name: docs-maps
on:
  pull_request:
    paths: ["**/src/**", "**/pom.xml", "scripts/docs/**"]                 # contracts live under core/src/main/resources

env:
  REPO_KIND: ${{ vars.REPO_KIND || 'be' }}        # be | fe
  MAX_LINES: ${{ vars.MAX_LINES || 400 }}          # 400 for the backend, 300 for the frontend

jobs:
  freshness:
    name: generated maps up to date / file size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated maps match source
        run: python3 scripts/docs/gen-all.py --root . --check
      - name: File size budget (token hygiene)
        run: python3 scripts/check-file-size.py --root . --max-lines "$MAX_LINES" --baseline .filesize-baseline.txt
