# Bounded contexts of the platform and how code maps to them.
#
# The backend is layered (package-by-layer: api, manager, service, dao, event, job, utils, ...), so the business
# area of a class is not in its folder but in its NAME PREFIX. A BE class belongs to the context whose `be` prefix
# is the LONGEST match at the start of its simple class name; classes matching no prefix are `shared`.
# The FE is package-by-feature: `fe` is the folder under src/features/. `spec` is the spec ID prefix (CLI-001, ...).
#
# Used by scripts/gen-graph.py (graph communities), scripts/context-pack.py and docs-map.yml authors.
# Keep one line per context; edit when a new class-name prefix appears (the graph lists unmatched classes as `shared`).

contexts:
  clients:  { spec: CLI, fe: clients,  be: [Client, Role] }
  meetings: { spec: MTG, fe: meetings, be: [Session, Meeting, RoleOverride, SessionClientConfig] }
  imports:  { spec: IMP, fe: "",       be: [Import, FileExchange, Movement, Movements, GoodsMovement, Xls, Workbook, DailyMovement, MonthlySnapshot] }
  product1: { spec: P1,  fe: product1, be: [Product1, Projection, Peer, MovementInput, SessionMovementInput, SessionPeerSimulation] }
  product2: { spec: P2,  fe: product2, be: [Product2] }
  cover:    { spec: COV, fe: cover,    be: [Cover] }
  market:   { spec: MKT, fe: market,   be: [Market, Scenario, BaselinePrice] }
  stress:   { spec: STR, fe: stress,   be: [Stress] }
  reports:  { spec: RPT, fe: reports,  be: [Report, DocumentService] }
  admin:    { spec: ADM, fe: admin,    be: [Admin, Parameter] }
  # FE-only context: the client-facing presentation window (second browser window synchronised over a BroadcastChannel)
  presentation: { spec: PRS, fe: presentation, be: [] }
