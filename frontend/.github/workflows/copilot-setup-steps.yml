# Pre-installs the toolchain for the Copilot coding agent's environment. The job name MUST be `copilot-setup-steps`.
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]
  pull_request:
    paths: [".github/workflows/copilot-setup-steps.yml"]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (generated API client is committed; run npm run generate:api only after a contract change)
        run: npm ci
