# GitHub Copilot content exclusion (Repository settings -> Copilot -> Content exclusion).
# Honoured by the VS Code and JetBrains Copilot plugins, Copilot CLI and the coding agent: excluded files are never
# sent as context, not indexed, and not completed in. Keep the lists short and generic; use repo-level entries per repo.

# --- harbor-backend (Kotlin / Spring / Maven) ---
"*":
  - "**/target/**"
  - "**/target/generated-sources/**"                   # *Api interfaces generated from openapi/harbor-api.yaml - read the contract instead
  - "**/build/**"
  - "**/*.iml"
  - "**/generated/**"
  - "**/generated-sources/**"
  - "init_docker_compose/wiremock/**"                  # stub payloads of the external services - read harbor-core/src/main/resources/api instead
  - "**/src/test/resources/**/*.json"
  - "**/src/test/resources/**/*.csv"
  - "**/src/test/resources/**/*.xls*"                  # movement import fixtures
  - "**/*.p12"
  - "**/*.jks"
  - "**/application-*.yml"                             # env configs - secrets risk + noise

# --- harbor-frontend (React / TS) ---
# "*":
#   - "**/node_modules/**"
#   - "**/dist/**"
#   - "**/coverage/**"
#   - "**/package-lock.json"
#   - "**/pnpm-lock.yaml"
#   - "**/*.snap"
#   - "src/services/openapi/**"                        # openapi-typescript / Orval output - read the contract instead
#   - "**/public/locales/**"
#   - "**/__mocks__/**/*.json"

# Organisation-level (Settings -> Copilot -> Content exclusion) can hold the common part, e.g.:
# ORG/*:
#   - "**/*.pem"
#   - "**/*.key"
#   - "**/secrets/**"
