# Environment for the Copilot coding agent (runs before the agent starts; job name is mandatory).
# The repo scripts are standard-library Python 3.11+; pyyaml is only needed for the vendored OKF reference tools.
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Warm up validators and indexes
        run: |
          python3 scripts/build-index.py --check
          python3 scripts/okf-validate.py
          if [ -f generated/graph/graph.json ]; then python3 scripts/graph-query.py --find product1 > /dev/null; fi
