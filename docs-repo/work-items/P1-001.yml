feature: P1-001
project: HRB
epic:
  jira_key: null
  summary: "Product 1 overview: four projection tables, cover charts, city filter"
  description: |
    Session-scoped Product 1 screen showing the monthly projection as four cumulative tables
    (by sub-product, by city, by direction, summary) with horizon totals and cover ratio charts,
    filtered by city. Projections refresh on movements-loaded. The two modals have their own
    specs and work items: P1-002 (modelled movements) and P1-003 (peer simulation).
    Spec: features/product1/P1-001.md
  labels: [product1, docs-generated, needs-spec-review]
stories:
  - id: S1
    jira_key: null
    summary: "Return the four projection tables and cover series for a session"
    component: vertical
    description: |
      GET /session/product1/overview returns bySubProduct, byDimension (CITY), byDirection and summary
      for the session horizon, computed by monthly_projection from actual + modelled rows in the
      session's price basis and parameter snapshot. Grouping in Kotlin (ADR-0003).
    acceptance_criteria:
      - rule: BR-P1-001-1
        gherkin: |
          Given an open product1 session "S-1" for client "ACME-SYN" with horizon 24 months
          When the representative requests the Product 1 overview
          Then the response contains tables "bySubProduct", "byDimension", "byDirection", "summary" with 24 rows each
          And the response contains a cover ratio series per sub-product
      - rule: BR-P1-001-3
        gherkin: |
          Given actual movement 2027-01 P1-STD Aldmoor IN quantity 100 unit price 12.50
          And modelled movement 2027-01 P1-STD Aldmoor IN quantity 80 unit price 12.50
          When the representative requests the Product 1 projection
          Then the bySubProduct row for 2027-01 P1-STD has quantity 80
      - rule: BR-P1-001-4
        gherkin: |
          Given session "S-1" has price basis NRL
          And the parameter tariff.rate for product1/NRL was changed after the session started
          When the representative requests the Product 1 projection
          Then landed cost uses the tariff rate from the session parameter snapshot
      - rule: BR-P1-001-10
        gherkin: |
          Given a projection row whose unrounded value is 1.005
          When the representative requests the Product 1 projection
          Then the value cell is 1.00
    estimate: 8
    labels: [product1, calc]
    depends_on: []
    subtasks:
      - summary: "[DB] Flyway V5__projection.sql: projection_by_subproduct, projection_by_dimension, projection_by_direction, projection_summary"
        estimate_hours: 3
      - summary: "[BE] Product1Manager -> service/ProjectionService: merge actual + modelled rows, call utils/ProjectionAggregator, persist via dao/ProjectionRepository"
        estimate_hours: 8
      - summary: "[BE] getProduct1Overview / getProduct1Projection in api/Product1Controller (generated Product1Api) delegating to manager/Product1Manager"
        estimate_hours: 5
      - summary: "[FE] Product1OverviewPage + ProjectionTables (4 tables) + CoverRatioChart via useProduct1Overview"
        estimate_hours: 8
      - summary: "[TEST] API scenarios P1-001 S1 + calc scenario outline from monthly_projection worked examples"
        estimate_hours: 4
  - id: S2
    jira_key: null
    summary: "Filter the city table with the city selector"
    component: vertical
    description: |
      Query parameter city restricts byDimension to one hub; absent = all four; unknown = 400.
    acceptance_criteria:
      - rule: BR-P1-001-2
        gherkin: |
          Given an open product1 session "S-1"
          When the representative requests the Product 1 overview with city "Carrow"
          Then the byDimension table contains only dimension value "Carrow"
          And the other three tables are unchanged
      - rule: BR-P1-001-2
        gherkin: |
          Given an open product1 session "S-1"
          When the representative requests the Product 1 overview with city "Nowhere"
          Then the response status is 400
    estimate: 2
    labels: [product1]
    depends_on: [S1]
    subtasks:
      - summary: "[BE] Product1Manager: city filter + validation against the four hubs"
        estimate_hours: 2
      - summary: "[FE] CitySelector wired to useProduct1Overview params"
        estimate_hours: 3
      - summary: "[TEST] city filter scenarios"
        estimate_hours: 2
  - id: S5
    jira_key: null
    summary: "Refresh projections of open sessions on movements-loaded"
    component: integration
    description: |
      Product1ProjectionRefreshListener consumes harbor.imports.movements-loaded and recomputes
      the projection of every OPEN product1 session of the affected clients; cover ratio is recomputed too.
    acceptance_criteria:
      - rule: BR-P1-001-8
        gherkin: |
          Given an open product1 session "S-1" for client "ACME-SYN" and a closed session "S-0" for the same client
          When message from fixture "P1-001-movements-loaded.json" is published to "harbor.imports.movements-loaded"
          Then the projection of session "S-1" is recomputed
          And the projection of session "S-0" is unchanged
      - rule: BR-P1-001-9
        gherkin: |
          Given an open product1 session "S-1" with a cover policy covering 50% of P1-STD
          When the projection of session "S-1" is recomputed
          Then the summary table carries cover ratio 0.5000 for every month with P1-STD value only
    estimate: 3
    labels: [product1, kafka]
    depends_on: [S1]
    subtasks:
      - summary: "[INT] @KafkaListener event/Product1ProjectionRefreshListener (groupId harbor-product1) -> Product1Manager"
        estimate_hours: 4
      - summary: "[BE] service/ProjectionService: cover_ratio (utils/CoverRatioCalculator) into projection_summary on recompute"
        estimate_hours: 3
      - summary: "[TEST] consumer contract test with synthetic MovementsLoaded"
        estimate_hours: 3
  - id: S6
    jira_key: null
    summary: "Show horizon totals under the monthly projection tables"
    component: vertical
    description: |
      Every response carrying tables also carries tables.totals (calculation horizon_totals): each breakdown
      table summed over the whole horizon per key (quantity, value, landed cost, share of value) plus the
      overall line ALL. Derived from the persisted monthly lines, never stored. The screen shows them as three
      separate tables below the monthly ones; the client screen (PRS-001) mirrors them through the same component.
    acceptance_criteria:
      - rule: BR-P1-001-11
        gherkin: |
          Given an open product1 session "S-1" for client "ACME-SYN" with horizon 24 months
          And modelled movements 2026-11 P1-STD Aldmoor IN quantity 100 unit price 12.50 and 2026-12 P1-PRM Carrow OUT quantity 40 unit price 20.00
          When the representative requests the Product 1 overview
          Then "tables.totals.bySubProduct" has one line per sub-product with quantity, value, landedCost and shareOfValue
          And "tables.totals.overall" has key "ALL" and shareOfValue 1.0000
          And the values of "tables.totals.bySubProduct" sum to "tables.totals.overall.value"
      - rule: BR-P1-001-11
        gherkin: |
          Given the Product 1 overview of session "S-1" is displayed
          Then three tables "Total by sub-product", "Total by city" and "Total by direction" are shown below the summary table
          And each ends with the line "All"
      - rule: BR-P1-001-11
        gherkin: |
          Given the projection of session "S-1" has no movement rows
          When the representative requests the Product 1 projection
          Then "tables.totals.overall" has value 0.00 and shareOfValue 0.0000
          And the breakdown lists of "tables.totals" are empty
    estimate: 5
    labels: [product1, calc, needs-spec-review]
    depends_on: [S1]
    subtasks:
      - summary: "[BE] utils/ProjectionAggregator.totals / totalsOf (calculation horizon_totals) + unit test with the worked examples (ProjectionAggregatorTest)"
        estimate_hours: 4
      - summary: "[BE] contract ProjectionTotal / ProjectionTotals as ProjectionTables.totals in openapi_harbor.yaml; mapper/ProjectionMapper.totals; returned by getProduct1Overview, getProduct1Projection, putProduct1Movements (api/Product1Controller)"
        estimate_hours: 4
      - summary: "[FE] ProjectionTables: three totals tables (shared DataTable, footer line All) fed by useProduct1Overview / useProduct1Projection; regenerate src/services/openapi/schema.d.ts"
        estimate_hours: 5
      - summary: "[FE] presentation ProductMirror shows the totals through the shared ProjectionTables component (channel harbor.session.{*}, PRS-001)"
        estimate_hours: 2
      - summary: "[DOC] domain/calculations/horizon_totals.md (Attested Computation) and BR-P1-001-11 in P1-001; audit table"
        estimate_hours: 2
      - summary: "[TEST] API scenarios S6 + calculation scenario outline from the horizon_totals worked examples"
        estimate_hours: 3
questions:
  - "City filter scope (P1-001 open question): the imported page says only the city table is filtered, the code filters all four tables and the totals; BR-P1-001-2 is silent on the other three. S2 acceptance criteria assume the code behaviour until decided."
  - "Replacement granularity and grid start (monthly_projection audit Q1/Q2): BR-P1-001-3 says per key, the code replaces the whole month and starts the grid the month after today. S1 criteria follow BR-3 as written and will need re-checking."
  - "Stories S3, S4 and S7 of the earlier version moved to work-items/P1-002.yml (S1, S2) and work-items/P1-003.yml (S1) with the spec split of 2026-10-15; story ids here are kept so Jira references stay valid."
